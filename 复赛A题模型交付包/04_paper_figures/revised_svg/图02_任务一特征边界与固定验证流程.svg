   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #183b5b" x="370.224" y="95.30104" transform="rotate(-0 370.224 95.30104)">固定划分与模型评估</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(158.736 140.535228)">原始数据</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(135.111 156.468228)">10,000 人，64 列</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(158.736 228.352188)">模型输入</text>
    <text style="font-size: 12px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(99.111 244.285188)">34 个数值字段＋14 个类别字段</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(148.236 318.708027)">明确排除字段</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(109.339047 333.977152)">8 个睡眠字段＋2 个边界字段</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(108.662523 349.246277)">＋4 个综合字段＋编号＋目标</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #1e2a36" x="504.144" y="136.526688" transform="rotate(-0 504.144 136.526688)">按样本编号哈希划分</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(419.934 200.60467)">开发集</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(414.860523 215.873795)">8,000 人</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(542.354 200.60467)">锁定验证集</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(548.780523 215.873795)">2,000 人</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(398.684 272.649152)">开发集五折比较</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(398.684 287.254402)">仅在训练折拟合</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(397.088141 344.499392)">固定岭回归 α=1</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(393.184 359.104642)">完整开发集重拟合</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(538.104 344.499392)">一次锁定评估</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #1e2a36" transform="translate(538.104 359.104642)">保留审计结果</text>
   </g>
